name: Nightly Code Scan

on:
  schedule:
    # Run nightly at 2 AM UTC (adjust timezone as needed)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  nightly-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit mypy ruff pylint
          cd superset-frontend && npm install

      - name: Configure Git
        run: |
          git config --global user.name "Devin Nightly Scan"
          git config --global user.email "devin-scan@example.com"

      - name: Run Security Check
        id: security-check
        run: |
          echo "Running security check..."
          # This would normally invoke Devin CLI with the security-check skill
          # For now, we'll simulate the skill execution
          python scripts/run_security_scan.py || true
          echo "security_completed=true" >> $GITHUB_OUTPUT

      - name: Run Bug Scan
        id: bug-scan
        run: |
          echo "Running bug scan..."
          # This would normally invoke Devin CLI with the bug-scan skill
          python scripts/run_bug_scan.py || true
          echo "bug_completed=true" >> $GITHUB_OUTPUT

      - name: Run Latent Bugs Scan
        id: latent-bugs
        run: |
          echo "Running latent bugs scan..."
          # This would normally invoke Devin CLI with the latent-bugs skill
          python scripts/run_latent_scan.py || true
          echo "latent_completed=true" >> $GITHUB_OUTPUT

      - name: Generate Scan Report
        if: always()
        run: |
          python scripts/generate_scan_report.py

      - name: Create PR for Fixes
        if: |
          steps.security-check.outputs.security_completed == 'true' ||
          steps.bug-scan.outputs.bug_completed == 'true' ||
          steps.latent-bugs.outputs.latent_completed == 'true'
        run: |
          python scripts/create_fix_pr.py

      - name: Upload Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            scan-results/
            reports/
          retention-days: 30

      - name: Comment on Clean Run
        if: |
          steps.security-check.outputs.security_completed == 'true' &&
          steps.bug-scan.outputs.bug_completed == 'true' &&
          steps.latent-bugs.outputs.latent_completed == 'true'
        run: |
          python scripts/comment_clean_run.py